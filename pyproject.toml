[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "code-explainer"
version = "0.2.0"
description = "Interactive code walkthroughs with local voice narration."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# Environment markers are the packaging half of the compatibility layer:
# one `pip install -e ".[tts]"` picks the right engine for the machine.
tts = [
    "mlx-audio>=0.2.10; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "kokoro>=0.9.4; sys_platform != 'darwin' or platform_machine != 'arm64'",
]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["scripts/codeexplainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = ["real_tts: needs a real TTS engine and model download (slow)"]
addopts = "-m 'not real_tts'"

[tool.ruff]
line-length = 100
target-version = "py310"
# Legacy scripts, rewritten in later tasks (tts_server.py: Task 5, podcast.py: Task 6)
extend-exclude = ["scripts/tts_server.py", "scripts/podcast.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"
